#           gh release download dmg-latest -R OWNER/REPO -p 'AdaptiveCpp-Metal-arm64.dmg*'
#           shasum -a 256 -c AdaptiveCpp-Metal-arm64.dmg.sha256
#           hdiutil attach AdaptiveCpp-Metal-arm64.dmg -nobrowse -mountpoint /Volumes/acpp
#           /Volumes/acpp/install.sh $HOME/acpp
#           hdiutil detach /Volumes/acpp
#           echo "$HOME/acpp/bin" >> $GITHUB_PATH
